name: Bug report
description: Report reproducible Scout behavior without customer content or secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach customer audio, transcripts, images, context packs, databases, API keys, or Keychain exports.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, using synthetic or redacted data only?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal deterministic steps or a synthetic fixture.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scout version and commit
    validations:
      required: true
  - type: dropdown
    id: customer_data
    attributes:
      label: Customer data removed?
      options:
        - Yes, this report contains synthetic or fully redacted data only
    validations:
      required: true
