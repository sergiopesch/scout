name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Gateway/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install pinned Gateway dependencies
        run: npm ci --prefix Gateway
      - name: Verify repository
        run: make check
