name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: Gateway/package-lock.json
      - name: Install pinned XcodeGen
        shell: bash
        env:
          XCODEGEN_VERSION: "2.45.4"
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail
          xcodegen_version="$(tr -d '\r\n' < .xcodegen-version)"
          test "$xcodegen_version" = "$XCODEGEN_VERSION"
          xcodegen_archive="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          xcodegen_root="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            --output "$xcodegen_archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$xcodegen_archive" | shasum -a 256 --check
          ditto -x -k "$xcodegen_archive" "$xcodegen_root"
          lipo "$xcodegen_root/xcodegen/bin/xcodegen" -verify_arch arm64
          echo "$xcodegen_root/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Verify pinned XcodeGen
        run: |
          test "$(xcodegen --version)" = "Version: $(tr -d '\n' < .xcodegen-version)"
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          node --version
          npm --version
          xcodegen --version
      - name: Install pinned Gateway dependencies
        run: npm ci --prefix Gateway
      - name: Verify repository
        run: make check
