name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: Gateway/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify pinned XcodeGen
        run: |
          test "$(xcodegen --version)" = "Version: $(tr -d '\n' < .xcodegen-version)"
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          node --version
          npm --version
          xcodegen --version
      - name: Install pinned Gateway dependencies
        run: npm ci --prefix Gateway
      - name: Verify repository
        run: make check
