name: Scout

options:
  bundleIdPrefix: dev.scout
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  groupSortPosition: top
  minimumXcodeGenVersion: "2.45.0"

packages:
  ScoutCore:
    path: Packages/ScoutCore
  ScoutPersistence:
    path: Packages/ScoutPersistence

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Scout:
    type: application
    platform: macOS
    sources:
      - path: ScoutApp
    dependencies:
      - package: ScoutCore
      - package: ScoutPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scout.discovery
        PRODUCT_NAME: Scout
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scout
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Scout listens only while you run a discovery session so it can build an evidence-linked live transcript.
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Scout can capture meeting audio you explicitly select so it can model the conversation in real time.
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ScoutApp/Resources/Scout.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  ScoutTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScoutAppTests
    dependencies:
      - target: Scout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scout.discovery.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Scout:
    build:
      targets:
        Scout: all
    run:
      config: Debug
      commandLineArguments:
        "-ScoutDemoMode": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ScoutTests
    profile:
      config: Release
    archive:
      config: Release
